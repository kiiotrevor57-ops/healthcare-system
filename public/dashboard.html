<!DOCTYPE html>
<html>
<head>
    <title>County Health Inventory Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        /* HEADER */
        .header {
            background: linear-gradient(90deg, #0b3d91, #1e88e5);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #0b3d91;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 12px;
            opacity: 0.8;
        }

        /* LAYOUT */
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* KPI CARDS */
        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .kpi {
            font-size: 22px;
            font-weight: bold;
            color: #0b3d91;
        }

        /* ALERT */
        .alert {
            background: #ffe5e5;
            border-left: 5px solid red;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        /* TABLE */
        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f0f3f7;
        }

        .low {
            background: #ffe6e6;
            color: #b30000;
            font-weight: bold;
        }

        .expired {
            background: #fff3cd;
        }

        /* SEARCH */
        .topbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        input {
            width: 70%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px 15px;
            background: #0b3d91;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #062b66;
        }
    </style>
</head>

<body>

<div class="header">
    <div class="logo">NH</div>
    <div>
        <div class="title">County Health Inventory System</div>
        <div class="subtitle">Medicines • Stock • Supply Chain Monitoring</div>
    </div>
</div>

<div class="container">

    <!-- KPI -->
    <div class="cards">
        <div class="card">
            Total Medicines
            <div class="kpi" id="total">0</div>
        </div>

        <div class="card">
            Low Stock Alerts
            <div class="kpi" id="low">0</div>
        </div>

        <div class="card">
            Expired Items
            <div class="kpi" id="expired">0</div>
        </div>
    </div>

    <!-- ALERT -->
    <div class="alert">
        ⚠ Critical: Monitor low stock items to avoid facility shortages
    </div>

    <!-- SEARCH -->
    <div class="topbar">
        <input id="search" placeholder="Search medicine..." onkeyup="filterData()">
        <button onclick="loadData()">Refresh</button>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>QR ID</th>
                <th>Name</th>
                <th>Batch</th>
                <th>Expiry</th>
                <th>Quantity</th>
                <th>Reorder Level</th>
            </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>

</div>

<script>

let medicines = [];

function loadData() {
    fetch("/inventory")
    .then(res => res.json())
    .then(data => {
        medicines = data;
        render(data);
        updateKPIs(data);
    });
}

function render(data) {
    let html = "";

    data.forEach(m => {

        let low = m.quantity <= m.reorder_level;
        let expired = new Date(m.expiry_date) < new Date();

        html += `
        <tr class="${low ? 'low' : ''} ${expired ? 'expired' : ''}">
            <td>${m.qr_id}</td>
            <td>${m.name}</td>
            <td>${m.batch_number}</td>
            <td>${m.expiry_date}</td>
            <td>${m.quantity}</td>
            <td>${m.reorder_level}</td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
}

function updateKPIs(data) {

    document.getElementById("total").innerText = data.length;

    let low = data.filter(m => m.quantity <= m.reorder_level).length;
    let expired = data.filter(m => new Date(m.expiry_date) < new Date()).length;

    document.getElementById("low").innerText = low;
    document.getElementById("expired").innerText = expired;
}

function filterData() {

    let value = document.getElementById("search").value.toLowerCase();

    let filtered = medicines.filter(m =>
        m.name.toLowerCase().includes(value) ||
        m.qr_id.toLowerCase().includes(value)
    );

    render(filtered);
}

loadData();

</script>

</body>
</html>
