<!DOCTYPE html>
<html>
<head>
    <title>Nakuru County Health Inventory System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: #e5e7eb;
        }

        .header {
            padding: 18px;
            background: #0f172a;
            font-weight: bold;
            border-bottom: 1px solid #1f2a44;
        }

        .container {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: #111c33;
            padding: 12px;
            border-radius: 10px;
        }

        .value {
            font-size: 20px;
            font-weight: bold;
            margin-top: 5px;
        }

        .panel {
            background: #111c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        input, select {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            width: 180px;
        }

        button {
            padding: 10px 12px;
            background: #2563eb;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #111c33;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #1f2a44;
            text-align: left;
        }

        th {
            background: #0f172a;
        }

        .low { color: #ef4444; font-weight: bold; }
        .ok { color: #22c55e; }

        .alerts {
            border-left: 4px solid #ef4444;
            padding: 10px;
            background: #111c33;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="header">
    🏥 Nakuru County Health Inventory Control System
</div>

<div class="container">

    <!-- KPI -->
    <div class="grid">
        <div class="card">Total<div class="value" id="total">0</div></div>
        <div class="card">Low Stock<div class="value" id="low">0</div></div>
        <div class="card">Expired<div class="value" id="expired">0</div></div>
        <div class="card">Status<div class="value">ACTIVE</div></div>
    </div>

    <!-- ALERTS -->
    <div class="alerts" id="alerts">Loading...</div>

    <!-- CONTROLS -->
    <div class="panel">

        <h3>Add Stock</h3>

        <input id="name" placeholder="Medicine">
        <input id="facility" placeholder="Facility">
        <input id="qty" type="number" placeholder="Qty">
        <input id="reorder" type="number" placeholder="Reorder Level">
        <input id="expiry" type="date">

        <button onclick="addStock()">Add Stock</button>
    </div>

    <!-- FILTER -->
    <div class="panel">
        <select id="filter" onchange="render()">
            <option value="all">All Facilities</option>
            <option value="Nakuru Level 5">Nakuru Level 5</option>
            <option value="Molo Hospital">Molo Hospital</option>
            <option value="Naivasha Hospital">Naivasha Hospital</option>
        </select>

        <button onclick="load()">Refresh</button>
    </div>

    <!-- TABLE -->
    <table>
        <thead>
            <tr>
                <th>Medicine</th>
                <th>Facility</th>
                <th>Qty</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="table"></tbody>
    </table>

</div>

<script>

let data = [];

function load() {
    fetch("/api/inventory")
        .then(r => r.json())
        .then(res => {
            data = res;
            render();
        });
}

function addStock() {

    const item = {
        name: document.getElementById("name").value,
        facility: document.getElementById("facility").value,
        quantity: parseInt(document.getElementById("qty").value),
        reorder: parseInt(document.getElementById("reorder").value),
        expiry: document.getElementById("expiry").value
    };

    fetch("/api/inventory", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(item)
    }).then(() => load());
}

function reduceStock(index) {
    data[index].quantity -= 1;
    render();
}

function render() {

    let low = 0;
    let expired = 0;
    let html = "";

    const filter = document.getElementById("filter").value;

    data.forEach((item, i) => {

        if (filter !== "all" && item.facility !== filter) return;

        const isLow = item.quantity <= item.reorder;
        const isExpired = new Date(item.expiry) < new Date();

        if (isLow) low++;
        if (isExpired) expired++;

        html += `
        <tr>
            <td>${item.name}</td>
            <td>${item.facility}</td>
            <td>${item.quantity}</td>
            <td class="${isLow ? 'low' : 'ok'}">
                ${isLow ? "LOW STOCK" : "OK"}
            </td>
            <td>
                <button onclick="reduceStock(${i})">-1 Dispense</button>
            </td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
    document.getElementById("low").innerText = low;
    document.getElementById("expired").innerText = expired;
    document.getElementById("total").innerText = data.length;

    document.getElementById("alerts").innerHTML =
        low > 0 ? `⚠ ${low} items require immediate reorder` : "✔ All systems stable";
}

load();

</script>

</body>
</html>
