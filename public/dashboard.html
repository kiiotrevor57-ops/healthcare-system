<!DOCTYPE html>
<html>
<head>
    <title>County Health Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #0f172a;
            color: #e2e8f0;
        }

        .header {
            padding: 20px;
            background: #111c33;
            font-size: 18px;
            font-weight: bold;
        }

        .container {
            padding: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .card {
            background: #111c33;
            padding: 15px;
            border-radius: 10px;
        }

        .alerts {
            background: #1f2937;
            padding: 10px;
            border-left: 4px solid red;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #1f2a44;
            text-align: left;
        }

        .low {
            color: red;
        }

        .ok {
            color: green;
        }

        button {
            padding: 10px;
            background: #3b82f6;
            border: none;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="header">
    🏥 County Health Inventory System
</div>

<div class="container">

    <div class="grid">
        <div class="card">Total: <span id="total">0</span></div>
        <div class="card">Low Stock: <span id="low">0</span></div>
        <div class="card">Expired: <span id="expired">0</span></div>
        <div class="card">System: Active</div>
    </div>

    <div class="alerts" id="alerts">
        Loading alerts...
    </div>

    <button onclick="loadData()">Refresh</button>

    <br><br>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Facility</th>
                <th>Qty</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>

</div>

<script>

let data = [];

function loadData() {
    fetch("/api/inventory")
        .then(res => res.json())
        .then(res => {
            data = res;
            render();
        });
}

function render() {

    let low = 0;
    let expired = 0;
    let html = "";
    let alerts = "";

    data.forEach(item => {

        let isLow = item.quantity <= item.reorder;
        let isExpired = new Date(item.expiry) < new Date();

        if (isLow) low++;
        if (isExpired) expired++;

        if (isLow || isExpired) {
            alerts += `<div>⚠ ${item.name} - ${item.facility}</div>`;
        }

        html += `
        <tr>
            <td>${item.name}</td>
            <td>${item.facility}</td>
            <td>${item.quantity}</td>
            <td class="${isLow ? 'low' : 'ok'}">
                ${isLow ? "LOW" : "OK"}
            </td>
        </tr>`;
    });

    document.getElementById("table").innerHTML = html;
    document.getElementById("total").innerText = data.length;
    document.getElementById("low").innerText = low;
    document.getElementById("expired").innerText = expired;
    document.getElementById("alerts").innerHTML = alerts || "All systems normal ✔";
}

loadData();

</script>

</body>
</html>
